name: CI/CD Pipeline - Food Rescue Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build and Push Microservices
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - discovery-service
          - api-gateway
          - auth-service
          - user-service
          - offer-service
          - reservation-service
          - product-service
          - notification-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -f ${{ matrix.service }}/pom.xml

      # 1. Connexion sécurisée à Docker Hub via vos secrets personnalisés
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_FOOD_RESCUE_USERNAME }}
          password: ${{ secrets.DOCKER_FOOD_RESCUE_PASSWORD }}

      # 2. Construction et envoi de l'image Docker pour chaque microservice
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: abdo202/${{ matrix.service }}:latest