name: CI/CD Pipeline - Food Rescue Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_NAMESPACE: abdo202

jobs:
  # ==========================================================
  # JOB 1 : Build + Tests + Couverture + Analyse SonarQube
  # ==========================================================
  build-test-analyze:
    name: Build, Test and SonarQube Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # ⬇️ MODIFIÉ : Commande simplifiée (le cycle de vie s'occupe de JaCoCo)
      - name: Build, Test and Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B --no-transfer-progress
          verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      - name: Collect built JARs
        run: |
          find . -maxdepth 3 -path '*/target/*.jar' ! -name '*.original' -print0 \
            | tar --null -czf jars.tgz -T -
          tar -tzf jars.tgz

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: jars.tgz
          retention-days: 1
          if-no-files-found: error

  # ==========================================================
  # JOB 2 : Image Docker + Scan Trivy (+ push sur main uniquement)
  # ==========================================================
  docker-scan-push:
    name: Docker Build, Scan and Push
    needs: build-test-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-service
          - api-gateway
          - auth-service
          - user-service
          - offer-service
          - reservation-service
          - product-service
          - notification-service
          - payment-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Restore JARs into service folders
        run: tar -xzf jars.tgz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_FOOD_RESCUE_USERNAME }}
          password: ${{ secrets.DOCKER_FOOD_RESCUE_PASSWORD }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/${{ matrix.service }}:latest
            ${{ env.DOCKER_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.DOCKER_NAMESPACE }}/${{ matrix.service }}:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags ${{ env.DOCKER_NAMESPACE }}/${{ matrix.service }}