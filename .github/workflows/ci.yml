name: CI/CD Pipeline - Food Rescue Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # lancement manuel depuis l'onglet Actions

# Droits minimaux pour le GITHUB_TOKEN (principe du moindre privilège)
permissions:
  contents: read

# Annule les exécutions obsolètes d'une même PR quand un nouveau commit arrive
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_NAMESPACE: abdo202

jobs:
  # ==========================================================
  # JOB 1 : Build + Tests + Couverture + Analyse SonarQube
  # Exécuté UNE SEULE FOIS pour tous les microservices (pom racine)
  # ==========================================================
  build-test-analyze:
    name: Build, Test and SonarQube Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ignore les PR de forks et de Dependabot (pas d'accès au secret SONAR_TOKEN).
    # Les PR de vos collaborateurs (branches du même dépôt) sont bien analysées.
    if: >
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout Code
        uses: actions/checkout@b4ffde65f46336ab88eb53b91c7e5e10a9b72e73 # v4.1.1
        with:
          fetch-depth: 0  # historique complet : requis par Sonar (new code, blame)

      - name: Set up Java 21
        uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache SonarQube packages
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Compile, teste (JaCoCo configuré dans chaque pom), package les .jar, puis envoie à Sonar.
      # qualitygate.wait=true : le job échoue si le Quality Gate n'est pas respecté.
      - name: Build, Test and Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B --no-transfer-progress
          clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      # En cas d'échec, conserve les rapports de tests pour comprendre l'erreur
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
          if-no-files-found: ignore

      # On réutilise les .jar déjà construits et testés : pas de second build dans la matrice
      - name: Collect built JARs
        run: |
          find . -maxdepth 3 -path '*/target/*.jar' ! -name '*.original' -print0 \
            | tar --null -czf jars.tgz -T -
          tar -tzf jars.tgz

      - name: Upload JARs
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: service-jars
          path: jars.tgz
          retention-days: 1
          if-no-files-found: error

  # ==========================================================
  # JOB 2 : Image Docker + Scan Trivy (+ push sur main uniquement)
  # Ne démarre que si tests + Quality Gate sont OK
  # ==========================================================
  docker-scan-push:
    name: Docker Build, Scan and Push
    needs: build-test-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-service
          - api-gateway
          - auth-service
          - user-service
          - offer-service
          - reservation-service
          - product-service
          - notification-service
          - payment-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@b4ffde65f46336ab88eb53b91c7e5e10a9b72e73 # v4.1.1

      - name: Download JARs
        uses: actions/download-artifact@65a9edc58814465132a0eec9d3006c4fec57d18c # v4.1.7
        with:
          name: service-jars

      - name: Restore JARs into service folders
        run: tar -xzf jars.tgz

      # Message d'erreur clair si un service n'a pas de Dockerfile ou de .jar
      - name: Check Dockerfile and JAR exist
        run: |
          if [ ! -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "::error::Dockerfile manquant dans ${{ matrix.service }}/"
            exit 1
          fi
          if ! ls ${{ matrix.service }}/target/*.jar >/dev/null 2>&1; then
            echo "::error::Aucun .jar dans ${{ matrix.service }}/target/"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00ba33a2ce7bd1836 # v3.3.0

      # Connexion à Docker Hub uniquement pour publier depuis main
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0cfd41e2b6 # v3.1.0
        with:
          username: ${{ secrets.DOCKER_FOOD_RESCUE_USERNAME }}
          password: ${{ secrets.DOCKER_FOOD_RESCUE_PASSWORD }}

      # Construit l'image localement (sans la pousser) pour pouvoir la scanner d'abord
      - name: Build Docker Image
        uses: docker/build-push-action@2cdde995de11925a030ce807a2a1dde02df40d5b # v5.3.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.DOCKER_NAMESPACE }}/${{ matrix.service }}:latest
            ${{ env.DOCKER_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ==========================================
      # Scan de vulnérabilités avec Trivy (avant tout push)
      # Action épinglée sur le SHA du commit v0.36.0 (les tags de cette action
      # ont été détournés lors d'une attaque en mars 2026 ; un SHA est immuable).
      # exit-code '0' = informatif ; passez à '1' pour bloquer sur CRITICAL/HIGH
      # ==========================================
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.DOCKER_NAMESPACE }}/${{ matrix.service }}:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Push uniquement depuis main, après tests + Quality Gate + scan
      - name: Push Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push --all-tags ${{ env.DOCKER_NAMESPACE }}/${{ matrix.service }}