server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        # 1. Bloquer l'accès externe à la gestion interne du stock
        - id: offer-service-stock-block
          uri: http://localhost:8080
          predicates:
            - Path=/api/offers/*/decrement, /api/offers/*/increment
          filters:
            - SetStatus=403

        # 2. Route normale offer-service pour toutes les autres requêtes
        - id: offer-service-route
          uri: lb://offer-service
          predicates:
            - Path=/api/offers/**

        - id: reservation-service-route
          uri: lb://reservation-service
          predicates:
            - Path=/api/reservations/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: partner-service
          uri: lb://PARTNER-SERVICE
          predicates:
            - Path=/api/partners/**

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/