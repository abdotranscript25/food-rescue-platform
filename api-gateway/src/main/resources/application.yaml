server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"   # Vite
              - "http://localhost:3000"   # fallback
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        # 1. Bloquer l'accès externe à la gestion interne du stock
        - id: offer-service-stock-block
          uri: http://localhost:8080
          predicates:
            - Path=/api/offers/*/decrement, /api/offers/*/increment
          filters:
            - SetStatus=403

        # 2. Route normale offer-service pour les offres et les avis
        - id: offer-service-route
          uri: lb://offer-service
          predicates:
            - Path=/api/offers/**, /api/reviews/**

        - id: reservation-service-route
          uri: lb://reservation-service
          predicates:
            - Path=/api/reservations/**

        # AJOUT DU NOUVEAU SERVICE DE PAIEMENT
        - id: payment-service-route
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: partner-service
          uri: lb://PARTNER-SERVICE
          predicates:
            - Path=/api/partners/**

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/