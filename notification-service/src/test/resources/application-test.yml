spring:
  application:
    name: notification-service

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false             # ← EMPÊCHE le listener de démarrer
        missing-queues-fatal: false
        recovery-interval: 10000

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: dummy-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cloud:
    discovery:
      enabled: false

  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

MAIL_USERNAME: test@example.com
MAIL_PASSWORD: dummy-password