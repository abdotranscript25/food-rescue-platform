server:
  port: 8081

spring:
  application:
    name: offer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/foodrescue_offers
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  jwt:
    secret: ${JWT_SECRET:MaCleSecreteParDefautPourLeDeveloppementLocalQuiDoitFaireAuMoins256BitsDeLongueur}
    expiration: 86400000  # 24 heures en millisecondes