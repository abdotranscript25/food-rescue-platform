spring:
  datasource:
    url: jdbc:h2:mem:offerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  cloud:
    discovery:
      enabled: false
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: dGVzdHNlY3JldGtleWZvcnRlc3Rpbmdvbmx5d2l0aDMyK2NoYXJzMTIzNDU2
  expiration: 86400000